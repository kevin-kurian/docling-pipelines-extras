services:
  docpipe:
    image: kevin1kurian/docling-pipelines:v2.0.1-cpu
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      DOCPIPE_DATA_PATH: /data
      FLOW_REPOSITORY_BASE_DIR: /data/flows
      HF_HOME: /data/models/huggingface
      OLLAMA_HOST: http://ollama:11434
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD}
    volumes:
      - docpipe-data:/data
      - docpipe-data:/opt/app-root/data
      - docpipe-data:/opt/app-root/src/data
      - ../datasets/10-pdf-files/pdf:/documents:ro
      - ../datasets/100-text-files/text:/text-documents:ro
    depends_on:
      ollama:
        condition: service_started
      opensearch:
        condition: service_healthy

volumes:
  docpipe-data:
